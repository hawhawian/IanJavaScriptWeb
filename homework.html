<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N*N乘法表</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" href="img/user.png" type="image/png">
    <style>
        body{
            background-color: #D2E9FF;
        }
        div#myId {
            background: none;
            width: auto;
            padding: 0;
            margin: 0;
            margin-top: 20px;
        }
        table, tr, td{
            border: 1px solid #aeefff;
            border-collapse: collapse;
        }
        table{
            text-align:center;
            margin: 0 auto;
        }
        td{
            padding: 5px;
            text-align: center;
        }
        .center {
            text-align: center;
            margin: 0 auto;
        }
    </style>
    <script>
        function myFunction() {
            var n = document.getElementById('numberInput').value;

            var str="<table>";

            for (let i = 1; i <= n; i++) {
                str+="<tr>";
                for (let j = 1; j <= n; j++) {
                    str+=`<td> ${i} * ${j} = ${i*j}</td>`;
                }
                str+="</tr>";
            }
            str+="</table>";

            document.getElementById("myId").innerHTML = str;
        }
    </script>
</head>

<body>
    <div class="center">
        <a href="index.html">首頁</a>
        <a href="about.html">關於我</a>
        <a href="research.html">研究</a>
        <a href="homework.html">N*N乘法表</a>
        <a href="https://hawhawian.github.io/IanWaterPuzzle/">Water Puzzle</a>
        <a href="https://hawhawian.github.io/ian-react-app/">React</a>
        <a href="https://github.com/hawhawian">GitHub</a>
    </div>
    <div class="center"><h1>N*N乘法表</h1></div>
    <div class="center">
        <label for="numberInput">輸入數值:</label>
        <input type="number" id="numberInput" placeholder="輸入數值" />
        <input type="button" value="OK" title="OK" onclick="myFunction()" />
    </div>
    <div id="myId" class="card"></div>
</body>

</html>
